[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

# Privater Bereich: nicht indexieren, nicht cachen
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/en/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
